<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto - Fonten</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      line-height: 1.7;
    }

    .container {
      width: min(760px, 92%);
      margin: 0 auto;
      padding: 64px 0;
    }

    a {
      color: #7dd3fc;
      text-decoration: none;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 34px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 64px);
      line-height: 1;
      letter-spacing: -0.06em;
      margin-bottom: 16px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
    }

    .btn {
      display: inline-block;
      margin-top: 24px;
      background: #ffffff;
      color: #0f172a;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 700;
    }

    .back {
      display: inline-block;
      margin-bottom: 28px;
      color: #93c5fd;
    }
  </style>
</head>

<body>
  <div class="container">
    <a class="back" href="index.html">← Volver a Fonten</a>

    <div class="card">
      <h1>Contacto</h1>
      <p>
        Para consultas, soporte, privacidad o información sobre Fonten, puedes escribirnos a:
      </p>

      <p>
        <strong>Email:</strong>
        <a href="mailto:soporte@fontenapp.com">soporte@fontenapp.com</a>
      </p>

      <a class="btn" href="mailto:soporte@fontenapp.com">Enviar email</a>
    </div>
  </div>
</body>
</html>
